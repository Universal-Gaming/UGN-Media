name: Diagnose UGN Media Public Counter API
on:
  push:
    paths:
      - '.github/workflows/diagnose-counter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe replacement services without increasing counts
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json, time
          endpoints = {
            "abacus": "https://abacus.jasoncameron.dev/get/ugn-media-play-tracking-v2/total",
            "countapi": "https://countapi.mileshilliard.com/api/v1/get/ugn_media_dvd_20261118_total",
            "countapi_health": "https://countapi.mileshilliard.com/health"
          }
          for name, url in endpoints.items():
            start=time.monotonic()
            req=urllib.request.Request(url, headers={"Origin":"https://universal-gaming.github.io", "User-Agent":"UGN-Media-Diagnostics/1.0"})
            try:
              with urllib.request.urlopen(req, timeout=9) as res:
                body=res.read(600).decode("utf-8","replace")
                print(json.dumps({"name":name,"status":res.status,"cors":res.headers.get("Access-Control-Allow-Origin"),"body":body,"latency_seconds":round(time.monotonic()-start,2)}))
            except urllib.error.HTTPError as e:
              print(json.dumps({"name":name,"status":e.code,"cors":e.headers.get("Access-Control-Allow-Origin"),"body":e.read(500).decode("utf-8","replace")}))
            except Exception as e:
              print(json.dumps({"name":name,"error":str(e)}))
          PY
