name: Verify UGN Media Play Counter
on:
  push:
    paths:
      - '.github/workflows/diagnose-counter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify GET, HIT, GET with test-only counter key
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          import uuid
          root = "https://countapi.mileshilliard.com/api/v1"
          key = "ugn_media_probe_" + uuid.uuid4().hex[:18]
          origin = "https://universal-gaming.github.io"
          def check(operation):
            req = urllib.request.Request(f"{root}/{operation}/{key}",headers={"Origin":origin,"User-Agent":"UGN Media test"})
            try:
              with urllib.request.urlopen(req,timeout=12) as response:
                body = response.read().decode("utf-8")
                data = json.loads(body)
                cors = response.headers.get("Access-Control-Allow-Origin")
                print(json.dumps({"method":operation,"status":response.status,"cors":cors,"json":data}))
                if cors not in (origin,"*"): raise AssertionError("CORS blocks GitHub Pages browsers")
                return response.status, data
            except urllib.error.HTTPError as e:
              body=e.read().decode("utf-8","replace")
              print(json.dumps({"method":operation,"status":e.code,"body":body,"cors":e.headers.get("Access-Control-Allow-Origin")}))
              return e.code, json.loads(body)
          initial,_=check("get")
          assert initial==404, "Expected new key to be missing before first play"
          status,hit=check("hit")
          assert status==200 and int(hit["value"])==1, "Play increment did not work"
          status,read=check("get")
          assert status==200 and int(read["value"])==1, "Read did not return saved play"
          print("PASS: real service increment persists, read has no side effects, CORS allows Pages.")
          PY
