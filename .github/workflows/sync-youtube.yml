name: Sync UGN YouTube DVDs

on:
  workflow_dispatch:
    inputs:
      replay_links:
        description: 'Optional archived livestream URLs (separate with spaces or newlines; optional URL | Title per line)'
        required: false
        type: string
      video_links:
        description: 'Optional regular YouTube URLs (one per line; optional URL | Title)'
        required: false
        type: string
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: write

concurrency:
  group: ugn-media-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YouTube discovery tool
        run: python -m pip install --upgrade yt-dlp
      - name: Save manually selected DVDs
        env:
          UGN_LIVE_LINKS: ${{ inputs.replay_links }}
          UGN_VIDEO_LINKS: ${{ inputs.video_links }}
        run: python scripts/pin_discs.py
      - name: Discover latest channel uploads
        id: videos
        continue-on-error: true
        run: python scripts/sync_youtube.py
      - name: Discover completed public livestreams
        id: lives
        continue-on-error: true
        run: python scripts/sync_lives.py
      - name: Commit video archives for GitHub Pages
        run: |
          git add videos.json lives.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(media): sync persistent video and livestream DVDs"
            git push
          else
            echo "No archive changes detected"
          fi
      - name: Report DVD counts and fail if still empty
        if: always()
        run: |
          echo "Uploads discovery: ${{ steps.videos.outcome }}"
          echo "Livestream discovery: ${{ steps.lives.outcome }}"
          python scripts/check_archive.py
